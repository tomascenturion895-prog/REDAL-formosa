<!doctype html>
<html lang="es-AR">

    <title>Sin conexión | RedAL Formosa</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8f7; color: #1c201f; font-family: system-ui, sans-serif; text-align: center; padding: 1.5rem; }

  <body>
    <main>
      <h1>No tenés conexión</h1>
      <p>Revisá tu internet y volvé a intentar. Tu carrito sigue guardado en este dispositivo.</p>
